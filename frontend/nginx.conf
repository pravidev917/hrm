# HRM SPA + API proxy for the Docker stack.
#
# Included from the image's nginx.conf inside the http{} block, so the shared
# memory zone below can be declared here.
#
# Same-origin model: nginx serves the built SPA and proxies /api to the backend
# container. "/api" is the compose service name; nginx resolves it once at
# startup, which is why the backend service must be up first (compose uses
# depends_on: service_healthy).

limit_req_zone $binary_remote_addr zone=hrm_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Container healthcheck target: never proxies, never logged.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Versioned assets are content-hashed by Vite and cacheable forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA routes fall back to index.html, never cached.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Second layer of sign-in abuse protection (the backend enforces the first).
    location = /api/auth/admin/login {
        limit_req zone=hrm_login burst=5 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/employee/login {
        limit_req zone=hrm_login burst=5 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Readiness probe: keep it out of access logs.
    location = /api/health {
        access_log off;
        proxy_pass http://backend:8080;
        proxy_read_timeout 5s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
