# HRM — self-contained stack (PostgreSQL + Spring Boot API + nginx/SPA).
#
#   cp .env.example .env      # fill DB_PASSWORD and JWT_SECRET
#   docker compose up -d --build
#   docker compose ps
#   open http://localhost:${WEB_PORT:-8080}
#
# Everything runs as containers on one network:
#   web  -> nginx, serves the built SPA and proxies /api to backend:8080
#   backend -> Spring Boot, talks to db:5432
#   db   -> PostgreSQL 16, applies docs/migrations/V1__baseline_schema.sql on the
#           very first start (the data volume is empty then; later starts skip it)
#
# This file is the local/standalone flavour. For AWS see deploy/aws/:
#   - deploy/aws/docker-compose.yml   EC2 + RDS (images pulled from ECR)
#   - deploy/aws/ecs/                 ECS Fargate task definitions
#   - deploy/aws/terraform/           VPC-free minimal starter: ECR, RDS, EC2

name: hrm

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-hrm}
      POSTGRES_USER: ${DB_USER:-hrm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD (in .env or the shell)}
      # Deterministic initdb output regardless of host locale.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: ${APP_TIMEZONE:-Asia/Kolkata}
    volumes:
      - db-data:/var/lib/postgresql/data
      # Runs once, only while the volume is empty. The script refuses to apply
      # itself to a non-empty public schema (see its guard).
      - ./docs/migrations/V1__baseline_schema.sql:/docker-entrypoint-initdb.d/10-baseline.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -q"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [hrm]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: hrm-backend:${IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-hrm}
      DB_USERNAME: ${DB_USER:-hrm}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      # The schema comes from the baseline script, so production semantics apply.
      DB_DDL_AUTO: ${DB_DDL_AUTO:-validate}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (>= 32 bytes)}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      # http://localhost has no TLS, so a Secure cookie would never be sent.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-INFO}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}
      DEFAULT_ADMIN_NAME: ${DEFAULT_ADMIN_NAME:-Administrator}
      TZ: ${APP_TIMEZONE:-Asia/Kolkata}
    # Not published: only the web container reaches it.
    expose:
      - "8080"
    networks: [hrm]

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    image: hrm-web:${IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_UPSTREAM: backend:8080
    ports:
      - "${WEB_PORT:-8080}:80"
    networks: [hrm]

volumes:
  db-data:

networks:
  hrm:
    driver: bridge
