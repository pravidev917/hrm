# HRM — production-like Docker stack.
#
#   cp .env.example .env      # once; compose reads it for the ${...} values
#   docker compose up -d --build
#   open http://localhost:8080
#
# Topology (same origin, same model as deploy/nginx/hrm.conf):
#
#   browser ──► web (nginx:80) ──┬── /        → built SPA (/usr/share/nginx/html)
#                                └── /api/    → backend:8080 (Spring Boot jar)
#   backend ──► db:5432 (PostgreSQL 16, never published to the host)
#
# The database is initialised from docs/migrations/V1__baseline_schema.sql on
# first boot, so the backend runs with DB_DDL_AUTO=validate exactly as in
# production. To start over: docker compose down -v  (deletes the data volume).
#
# See docs/DOCKER.md.

name: hrm

# Values the backend reads. Shared by every service that needs them; all of them
# come from .env (see .env.example) with the same defaults as the local dev run.
x-backend-env: &backend-env
  DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-hrm_db}
  DB_USERNAME: ${POSTGRES_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set - copy .env.example to .env}
  DB_DDL_AUTO: validate
  DB_POOL_SIZE: ${DB_POOL_SIZE:-8}
  JPA_SHOW_SQL: "false"
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set - copy .env.example to .env (min 32 bytes)}
  JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
  APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
  ATTENDANCE_MAX_ACCURACY_METERS: ${ATTENDANCE_MAX_ACCURACY_METERS:-50}
  LOCATION_MAX_AGE_SECONDS: ${LOCATION_MAX_AGE_SECONDS:-120}
  # The browser always sends an Origin header on POST, even same-origin, and
  # Spring's CORS filter answers 403 for an origin that is not listed. Cover
  # both ways of reaching the published web port, not just localhost.
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:${HRM_HTTP_PORT:-8080},http://127.0.0.1:${HRM_HTTP_PORT:-8080}}
  SERVER_PORT: "8080"
  LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
  LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
  LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-INFO}
  LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
  DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-}
  DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}
  DEFAULT_ADMIN_NAME: ${DEFAULT_ADMIN_NAME:-Administrator}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hrm_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set - copy .env.example to .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      # V1, V2, ... are applied in filename order, only when the data volume is
      # empty (docker-entrypoint-initdb.d). README.md is ignored by PostgreSQL.
      - ./docs/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    # No "ports": PostgreSQL stays reachable only on the compose network.

  backend:
    build:
      context: ./backend
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        # Same origin: the SPA calls relative /api/... paths.
        VITE_API_BASE_URL: ""
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HRM_HTTP_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  db-data:
