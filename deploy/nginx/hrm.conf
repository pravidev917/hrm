# HRM nginx site — TEMPLATE. Placeholders: __DOMAIN__
#
# Install:
#   sudo cp deploy/nginx/hrm.conf /etc/nginx/sites-available/hrm
#   sudo ln -s /etc/nginx/sites-available/hrm /etc/nginx/sites-enabled/hrm
#   sudo nginx -t && sudo systemctl reload nginx
#
# Same-origin model: nginx serves the built SPA (built with VITE_API_BASE_URL=)
# and proxies /api to Spring Boot on 127.0.0.1:8080. No CORS is exercised.
#
# INTERIM MODE (no certificate yet): comment out the entire "server { listen 443 ... }"
# block below, and in it uncomment the HTTP-only branch. Do NOT move to HTTPS
# + Secure cookies until a real certificate exists.

limit_req_zone $binary_remote_addr zone=hrm_login:10m rate=10r/m;

upstream hrm_backend {
    server 127.0.0.1:8080;
    keepalive 16;
}

# HTTP: ACME challenge + redirect to HTTPS
server {
    listen 80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # INTERIM (no certificate yet) — serve the app over HTTP only:
    # root /var/www/hrm;
    # index index.html;
    # location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-store"; }
    # location /api/ { proxy_pass http://hrm_backend; include /etc/nginx/proxy_params; }
    # END INTERIM

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    root /var/www/hrm;
    index index.html;
    client_max_body_size 2m;

    # Versioned static assets are hashed by Vite and cacheable forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA routes fall back to index.html, never cached.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://hrm_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Second layer of sign-in abuse protection (fast, cheap).
    location = /api/auth/admin/login {
        limit_req zone=hrm_login burst=5 nodelay;
        proxy_pass http://hrm_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/employee/login {
        limit_req zone=hrm_login burst=5 nodelay;
        proxy_pass http://hrm_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Readiness probe: keep it out of access logs.
    location = /api/health {
        access_log off;
        proxy_pass http://hrm_backend;
        proxy_read_timeout 5s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}