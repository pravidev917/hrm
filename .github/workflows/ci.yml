name: HRM CI

on:
  push:
    branches:
      - main
      - develop
      - staging
      - feature/**
  pull_request:
    branches:
      - main
      - develop
      - staging

permissions:
  contents: read

# A push to a branch and the PR opened from that branch are two different
# refs, so they used to run as two separate builds. Keying the group on
# head_ref-or-ref_name puts both in one group, so the newer run cancels the
# older one instead of paying for the same build twice.
concurrency:
  group: hrm-ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hrm_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hrm_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/hrm_db
      DB_USERNAME: postgres
      DB_PASSWORD: ci_test_password
      JWT_SECRET: ci-only-jwt-secret-key-at-least-32-bytes
      # Pinned so results do not depend on the runner's locale. The JDBC driver
      # forwards the JVM default zone to Postgres, and legacy aliases such as
      # Asia/Calcutta are rejected as an invalid TimeZone parameter.
      TZ: UTC

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Frontend checks are cheap; running them first keeps a broken lint from
      # waiting behind a full Maven build.
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven wrapper executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Build and test backend
        working-directory: backend
        run: ./mvnw -B verify

      - name: Upload backend test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
