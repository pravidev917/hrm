name: Docker images

# Builds the backend (and the self-hostable web) image and publishes it to GHCR
# with environment-specific tags, so a staging build can never be mistaken for a
# production release:
#
#   develop  -> staging-<short-sha>, staging-latest, sha-<short-sha>
#   main     -> production-<short-sha>, production-latest, sha-<short-sha>
#   v1.2.3   -> 1.2.3, v1.2.3, sha-<short-sha>
#
# The Oracle VM pulls hrm-backend by tag (deploy-oracle.yml). The web image is
# still published for local/self-hosted runs; on Vercel the frontend is built by
# Vercel itself, not from this image.
#
# No cloud credentials are needed: GHCR uses the workflow token.

on:
  push:
    branches: [main, develop]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: ./backend
          - image: web
            context: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Normalise repository name
        id: repo
        run: echo "lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.lower }}-${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=sha,prefix=staging-,format=short,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,prefix=production-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=staging-latest,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=production-latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # Oracle's Always Free Ampere shape is arm64, the AMD shapes are
          # amd64: publish both so the VM size stays a cost choice, not a
          # constraint. QEMU builds the non-native half.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: true
          sbom: true
