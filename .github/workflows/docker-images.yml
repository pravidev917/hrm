name: Docker images

# Builds the two deployable images and publishes them with environment-specific
# tags, so a staging build can never be mistaken for a production release:
#
#   develop  -> ghcr/ECR  staging-<short-sha>, staging-latest, sha-<short-sha>
#   main     -> ghcr/ECR  production-<short-sha>, production-latest, sha-<short-sha>
#   v1.2.3   -> ghcr/ECR  1.2.3, v1.2.3, sha-<short-sha>
#
# ECR publishing needs the repository variable AWS_REGION and the secret
# AWS_DEPLOY_ROLE_ARN (GitHub OIDC, no long-lived AWS keys).

on:
  push:
    branches: [main, develop]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_PREFIX: ghcr.io

jobs:
  ghcr:
    name: Publish to GHCR (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: ./backend
          - image: web
            context: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Normalise repository name
        id: repo
        run: echo "lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_PREFIX }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_PREFIX }}/${{ steps.repo.outputs.lower }}-${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=sha,prefix=staging-,format=short,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,prefix=production-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=staging-latest,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=production-latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: true
          sbom: true

  ecr:
    name: Publish to ECR (${{ matrix.image }})
    runs-on: ubuntu-latest
    if: vars.AWS_REGION != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: ./backend
            ecr_repo: hrm-backend
          - image: web
            context: ./frontend
            ecr_repo: hrm-web

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-hrm-images

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ecr.outputs.registry }}/${{ matrix.ecr_repo }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=sha,prefix=staging-,format=short,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,prefix=production-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=staging-latest,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=production-latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
