name: Deploy to AWS

# Ships an already-published image tag to the EC2 Docker host and rolls back
# automatically when the health check fails (deploy/aws/deploy-remote.sh).
#
# Required configuration
#   secrets: AWS_DEPLOY_ROLE_ARN, EC2_HOST, EC2_USER, EC2_SSH_KEY
#   vars:    AWS_REGION
#   environment "production" (add required reviewers to gate the deploy)
#
# Trigger: manually, or automatically after "Docker images" succeeds on main.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (defaults to sha-<short sha of this commit>)'
        required: false
        type: string
  workflow_run:
    workflows: ['Docker images']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: hrm-deploy-production
  cancel-in-progress: false

env:
  APP_DIR: /opt/hrm

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    environment: production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          set -euo pipefail
          tag="${{ inputs.image_tag }}"
          if [ -z "$tag" ]; then
            tag="sha-$(echo '${{ github.sha }}' | cut -c1-7)"
          fi
          case "$tag" in
            *[!A-Za-z0-9._-]*) echo "invalid image tag: $tag" >&2; exit 1 ;;
          esac
          echo "value=$tag" >> "$GITHUB_OUTPUT"
          echo "deploying tag: $tag"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-hrm-deploy

      - name: Resolve ECR registry
        id: ecr
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          echo "registry=$account.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Check the image tag exists
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          if ! aws ecr describe-images --repository-name hrm-backend \
               --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "hrm-backend:$TAG is not in ECR - did the images workflow run?" >&2
            exit 1
          fi
          if ! aws ecr describe-images --repository-name hrm-web \
               --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "hrm-web:$TAG is not in ECR" >&2
            exit 1
          fi

      - name: Prepare SSH key
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hrm_deploy
          chmod 600 ~/.ssh/hrm_deploy
          # Pin the host key: tofu only after the fingerprint has been checked.
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Upload compose file and deploy script
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USER_NAME: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/hrm_deploy \
            deploy/aws/docker-compose.yml \
            "$USER_NAME@$HOST:~/hrm-docker-compose.yml"
          scp -i ~/.ssh/hrm_deploy \
            deploy/aws/deploy-remote.sh \
            "$USER_NAME@$HOST:~/hrm-deploy-remote.sh"
          scp -i ~/.ssh/hrm_deploy \
            deploy/aws/db-bootstrap.sh \
            "$USER_NAME@$HOST:~/hrm-db-bootstrap.sh"
          ssh -i ~/.ssh/hrm_deploy "$USER_NAME@$HOST" '
            set -euo pipefail
            sudo install -m 0755 ~/hrm-deploy-remote.sh /opt/hrm/deploy-remote.sh
            sudo install -m 0755 ~/hrm-db-bootstrap.sh /opt/hrm/db-bootstrap.sh
            sudo install -m 0644 ~/hrm-docker-compose.yml /opt/hrm/docker-compose.yml
            rm -f ~/hrm-deploy-remote.sh ~/hrm-db-bootstrap.sh ~/hrm-docker-compose.yml
          '

      - name: Deploy
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USER_NAME: ${{ secrets.EC2_USER }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/hrm_deploy "$USER_NAME@$HOST" \
            "sudo IMAGE_TAG='$TAG' ECR_REGISTRY='$REGISTRY' /opt/hrm/deploy-remote.sh"

      - name: Verify the public endpoint
        env:
          HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://$HOST/api/health" || true)"
            if [ "$code" = "200" ]; then
              echo "public health check: 200"
              exit 0
            fi
            echo "attempt $attempt: $code"
            sleep 6
          done
          echo "public health check did not return 200" >&2
          exit 1

      - name: Clean up the key
        if: always()
        run: rm -f ~/.ssh/hrm_deploy
