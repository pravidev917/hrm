# Staging profile: activated by SPRING_PROFILES_ACTIVE=staging.
#
# Staging is reached over plain HTTP through SSM port forwarding
# (http://localhost:8080), so unlike prod it must allow a non-Secure cookie -
# a browser silently discards "Secure" cookies on http, which looks like
# "login succeeds but nothing is authenticated".
#
# The schema is still validated: staging must fail the same way production
# would when a migration and the entities disagree.

# Default validate (the same gate production uses), but overridable for a one-off
# experiment: DB_DDL_AUTO=update only affects staging, never production.
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Driven by COOKIE_SECURE so the same image works behind TLS later.
app.cookie.secure=${COOKIE_SECURE:false}

logging.level.com.hrm.backend=${LOG_LEVEL_APP:INFO}
