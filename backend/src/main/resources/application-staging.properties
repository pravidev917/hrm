# Staging profile: activated by SPRING_PROFILES_ACTIVE=staging.
#
# Staging is a real HTTPS origin (Caddy on the Oracle VM), but with its own
# Supabase project and its own Vercel domain. This profile differs from prod in
# one respect only - it is noisier - while keeping the same safety rails:
#
#   * schema is validated, never altered, so a missing migration fails the deploy
#     instead of silently changing a table;
#   * the auth cookie is Secure (the browser is on a different origin, so
#     SameSite=None requires it) but the flag is env-driven so a quick
#     http-only experiment stays possible;
#   * DEBUG logging for the application package.

spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

app.cookie.secure=${COOKIE_SECURE:true}

logging.level.com.hrm.backend=${LOG_LEVEL_APP:DEBUG}
