spring.application.name=backend

# --- PostgreSQL -------------------------------------------------------------
# No dev defaults here on purpose: if DB_URL / DB_USERNAME are missing the
# application fails fast instead of silently pointing at a development database.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:8}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=3000

# --- Hibernate / JPA --------------------------------------------------------
# update is convenient for development; production must set DB_DDL_AUTO=validate
# (the application-prod.properties profile forces it) once the schema is
# baselined. See docs/migrations and docs/PRODUCTION.md.
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_SHOW_SQL:false}
# Pure JSON API: never hold a session open during response rendering.
spring.jpa.open-in-view=false

# --- JSON -------------------------------------------------------------------
# Timestamps serialise as ISO-8601 strings in the pinned application timezone.
# Spring Boot 4 / Jackson 3 exposes this under datatype.datetime, not serialization.
spring.jackson.time-zone=${APP_TIMEZONE:Asia/Kolkata}
spring.jackson.datatype.datetime.write-dates-as-timestamps=false

# --- Error endpoint ---------------------------------------------------------
# Never echo exception details through the default error endpoint.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

# --- Server -----------------------------------------------------------------
# Hosting platforms (Railway, Heroku, ...) inject PORT and route to it, so PORT
# wins when it is set. Local development keeps SERVER_PORT, default 8080.
server.port=${PORT:${SERVER_PORT:8080}}
# Honour X-Forwarded-* from the reverse proxy so client IPs and scheme are right.
server.forward-headers-strategy=framework
# Let in-flight requests finish during a graceful restart.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# --- JWT --------------------------------------------------------------------
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# --- Auth cookie ------------------------------------------------------------
# COOKIE_SECURE must be true in production (HTTPS only); the prod profile forces it.
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# --- CORS -------------------------------------------------------------------
# Comma separated, no spaces. Same-origin production requests send no Origin
# header, so this only matters for a separated frontend (e.g. local dev).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080}

# --- Company time and attendance verification ------------------------------
# Attendance dates use the office timezone when configured, else this fallback.
app.timezone=${APP_TIMEZONE:Asia/Kolkata}
# A browser fix worse than this is rejected: the radius check would be meaningless.
app.attendance.max-accuracy-meters=${ATTENDANCE_MAX_ACCURACY_METERS:50}
# How old a captured location may be when it reaches the server.
app.attendance.location-max-age-seconds=${LOCATION_MAX_AGE_SECONDS:120}

# --- Login abuse protection -------------------------------------------------
app.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.login.lock-minutes=${LOGIN_LOCK_MINUTES:15}

# --- Logging ----------------------------------------------------------------
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.hrm.backend=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{40} - %msg%n