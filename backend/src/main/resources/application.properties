spring.application.name=backend

# PostgreSQL Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hrm_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
# update is convenient for development; production should set DB_DDL_AUTO=validate
# once the schema has been baselined (see docs/PRODUCTION.md).
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_SHOW_SQL:false}

# Never echo exception details through the default error endpoint.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Server
server.port=${SERVER_PORT:8080}
# Honour X-Forwarded-* from the reverse proxy so client IPs and scheme are right.
server.forward-headers-strategy=framework

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Auth cookie. COOKIE_SECURE must be true in production (HTTPS only).
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# Browser origins allowed to call the API (comma separated, no spaces).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Login abuse protection: failures per identifier/IP before a temporary lock.
app.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.login.lock-minutes=${LOGIN_LOCK_MINUTES:15}

# Logging
logging.level.org.springframework.security=INFO
