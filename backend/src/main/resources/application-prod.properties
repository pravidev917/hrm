# Production profile: activated by SPRING_PROFILES_ACTIVE=prod in
# /etc/hrm/backend.env. Anything set here cannot be weakened by forgetting an
# environment variable in a development shell.

# The schema is applied from docs/migrations/V1__baseline_schema.sql and then
# validated on every boot. Never "update" a production database.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Session cookie only over HTTPS.
app.cookie.secure=true

# Logging stays at INFO in production unless LOG_LEVEL_* raises it.
logging.level.com.hrm.backend=${LOG_LEVEL_APP:INFO}
